<!DOCTYPE html>
<html lang="ar-TN" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Undercover · Mr white 2?</title>
    <meta name="description" content="A social deduction party game where Civilians, Undercovers, and Mr. White bluff, describe secret words, and unmask the infiltrators." />
    <meta property="og:title" content="Undercover · Mr white 2?" />
    <meta property="og:description" content="A social deduction party game where Civilians, Undercovers, and Mr. White bluff, describe secret words, and unmask the infiltrators." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="preload" href="/images/game_logo.png" as="image">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Unregister Service Workers to clear old cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
        // Also register the new one with a cache buster
        navigator.serviceWorker.register('./sw.js?v=4');

        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'CACHE_CLEARED') {
            console.log('Cache cleared, reloading...');
            window.location.reload(true);
          }
        });
      }
    </script>
    <script type="module" src="/index.tsx?v=2"></script>
  </body>
</html>
